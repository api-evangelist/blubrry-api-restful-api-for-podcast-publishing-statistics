  description: Blubrry documents OAuth 2.0 on https://blubrry.com/developer/api/oauth-2/ but the published
    contract declares no securitySchemes. Add the documented scheme so the contract states its own auth
    model.
  update:
    securitySchemes:
      OAuth2:
        type: oauth2
        description: OAuth 2.0 authorization-code. Client ID/secret are created from Manage Account ->
          Developers -> Create API Key. Access tokens expire after 1 hour; refresh tokens do not expire
          but can be revoked. No scopes are supported. Documented at https://blubrry.com/developer/api/oauth-2/
        flows:
          authorizationCode:
            authorizationUrl: https://api.blubrry.com/oauth2/authorize
            tokenUrl: https://api.blubrry.com/oauth2/token
            refreshUrl: https://api.blubrry.com/oauth2/token
            scopes: {}
- target: $
  description: Apply the documented OAuth 2.0 requirement to every operation; the API rejects unauthenticated
    calls with 401.
