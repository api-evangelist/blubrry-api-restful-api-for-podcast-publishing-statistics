- name: Media
  schema: [Media, Unpublished, Upload, Publish, Delete]
  description: >-
    A media file in a Program's storage. Lives in three states — uploaded/unpublished,
    published (bound to an episode), deleted.
  key: 'mediafile.ext (the filename)'
  parent_key: keyword
  fields: [id, status, name, length, created, last_modified, media_url, text]
  operations: [listUnpublishedMedia, uploadMedia, publishMedia, deleteMedia]
- name: MigrateMedia
  schema: [AddMigrateMedia, RemoveMigrateMedia]
