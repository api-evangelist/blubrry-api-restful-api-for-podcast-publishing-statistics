  parent_key: keyword
  fields: [url, urls, ids]
  operations: [post_addMigrateMedia, post_removeMigrateMedia, migrateMediaStatus]
- name: EpisodeStats
  schema: EpisodeObject
  description: >-
    Per-episode download and play measurement, including the partial-play buckets that carry
