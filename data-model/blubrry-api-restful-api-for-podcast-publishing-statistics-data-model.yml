note: >-
  Entity graph derived from the 35 component schemas and the path structure of Blubrry's own
  published contract. Blubrry's schemas contain almost no $ref links between entities — the
  graph is carried by the URL path and by id-reference FIELDS (program_keyword, episode_id,
  program_id) rather than by embedded objects, so relationships below are read from those
  fields and from what each operation addresses. Nothing here is invented; every entity and
  field name appears in the contract.
identifier_scheme:
  primary_key: keyword
  detail: >-
    The program keyword — a human-readable show slug, not an opaque id — is the root of every
    addressable path in the API (/episode/{keyword}/, /media/{keyword}/, /stats/{keyword}/).
    Numeric ids exist alongside it (program_id, podcast_id, stats_program_id, episode_id, media
    id) but only episode_id is ever used in a path. There are no prefixed ids.
  note: >-
    Three distinct numeric ids for one show appear side by side on the Hosted schema —
    program_id, podcast_id and stats_program_id — which is the clearest sign of the platform's
    seams: hosting, directory and statistics were separate systems and the contract still shows
    it. An integrator must not treat them as interchangeable.
entities:
