components:
  headers:
    xTotalHosted:
      schema:
        type: "integer"
        description: "Number of programs that are available to query"
    xTotalUnpublished:
      schema:
        type: "integer"
        description: "Number of unpublished media fields available to query"
    X-RawVoice-MD5-Checksum:
      schema:
        type: "string"
        description: "MD5 checksum of the file uploaded"
    X-RawVoice-Range:
      schema:
        type: "string"
        description: "Range of start and end bytes which supports multi-PUT requests to upload content in chunks"

  schemas:

    Countries:
      type: "object"
      properties:
        record_count:
          type: "integer"
          example: 2
        114:
          type: "object"
          properties:
            country_name:
              type: "string"
              example: Cambodia
            total:
              type: "integer"
              example: 5000
        223:
          type: "object"
          properties:
            country_name:
              type: "string"
              example: Vietnam
            total:
              type: "integer"
              example: 5000

    Apps:
      type: "object"
      properties:
        record_count:
          type: "integer"
          example: 2
        144:
          type: "object"
          properties:
            client_name:
              type: "string"
              example: Apple Podcasts
            client_class_id:
              type: "integer"
              example: 5
            total:
              type: "integer"
              example: 5000
        207:
          type: "object"
          properties:
            client_name:
              type: "string"
              example: Firefox
            client_class_id:
              type: "integer"
              example: 2
            total:
              type: "integer"
              example: 5000

    AppTypes:
      type: "object"
      properties:
        record_count:
          type: "integer"
          example: 1
        5:
          type: "object"
          properties:
            client_class_name:
              type: "string"
              example: Mobile Applications
            total:
              type: "integer"
              example: 5000
        2:
          type: "object"
          properties:
            client_class_name:
              type: "string"
              example: Web browsers
            total:
              type: "integer"
              example: 5000

    StatsWidget:
      type: "object"
      properties:
        program_keyword:
          type: "string"
        widget_title:
          type: "string"
        scale_min:
          type: "number"
        scale_max:
          type: "integer"
        scale_step:
          type: "integer"
        program_total:
          type: "integer"
        month_average:
          type: "integer"
        day_total_data:
          type: "object"
          description: "An associative array containing the totals for each of the most recent seven days"

    Owner:
      type: "object"
      properties:
        email:
          type: "string"
        name:
          type: "string"

    AppleCategory:
      type: "object"
      properties:
        apple category 1:
          type: "string"
        apple category 2:
          type: "string"
        apple category 3:
          type: "string"

    Subscribe:
      type: "object"
      properties:
        apple:
          type: "string"
        stitcher:
          type: "string"
        url:
          type: "string"
        google:
          type: "string"
        tunenin:
          type: "string"
        blubrry:
          type: "string"
        spotify:
          type: "string"
        iheart:
          type: "string"
        deezer:
          type: "string"
        pandora:
          type: "string"

    AddEpisode:
      type: "object"
      required:
        - "status"
        - "filename"
        - "title"
        - "content"
      properties:
        status:
          description: "Set to draft (0) or public (1)"
          type: "integer"
          format: "tinyint"
