name: Blubrry API
description: Blubrry is a podcast hosting and statistics platform providing a RESTful API for podcast
  publishing, media management, episode management, audience statistics, and podcast network functionality.
  The API uses OAuth 2.0 authentication and enables third-party applications to integrate with podcast
  hosting workflows.
