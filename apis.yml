- aid: blubrry-api-restful-api-for-podcast-publishing-statistics:blubrry-episode-management-api
  name: Blubrry Episode Management API
  description: >-
    The Blubrry Episode Management API supports creating new podcast episodes (publish, schedule, or save
    as draft) and updating existing episode fields. Enables CMS and podcast production tools to manage
    episode metadata programmatically.
  humanURL: https://blubrry.com/developer/api/
  tags:
  - Podcasting
  - Episodes
  - Publishing
  - CMS
  properties:
  - type: Documentation
    url: https://blubrry.com/developer/api/
- aid: blubrry-api-restful-api-for-podcast-publishing-statistics:blubrry-podcast-statistics-api
  name: Blubrry Podcast Statistics API
  description: >-
    The Blubrry Podcast Statistics API provides analytics for podcast episodes including download and
    play counts, overall show download summaries, monthly download breakdowns, and episode-level statistics
    for measuring podcast audience reach and growth.
  humanURL: https://blubrry.com/developer/api/
  tags:
  - Podcasting
  - Statistics
  - Analytics
  - Downloads
  - Audience
  properties:
  - type: Documentation
    url: https://blubrry.com/developer/api/
- aid: blubrry-api-restful-api-for-podcast-publishing-statistics:blubrry-podcast-network-api
  name: Blubrry Podcast Network API
  description: >-
    The Blubrry Podcast Network API provides access to user subscriptions with show management, episode
    metadata storage including playback status and position, show navigation by category and search, and
    access to Blubrry's podcast directory.
  humanURL: https://blubrry.com/developer/api/
  tags:
  - Podcasting
  - Network
  - Subscriptions
  - Directory
  properties:
  - type: Documentation
    url: https://blubrry.com/developer/api/
