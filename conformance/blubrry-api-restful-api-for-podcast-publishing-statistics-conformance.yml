domain_standards:
- id: iab-podcast-measurement
  name: IAB Tech Lab Podcast Measurement Technical Guidelines
  body: IAB Tech Lab
  conforms: true
  status: certified
  evidence: https://blubrry.com/support/statistics-documentation/blubrry-iab-podcast-measurement-certification/
  evidence_type: docs-claim
  detail: >-
    Blubrry states it was the first podcast host to achieve IAB Certified Compliance in podcast
    measurement, is a signatory to the IAB podcast measurement guidelines, and passes the
    independent audit IAB Tech Lab requires. The plans page reinforces it as a paid feature:
    "IAB-Certified Statistics" is included with Advanced Statistics and excluded from the Free
    and Standard tiers. This is the domain standard for the podcast measurement market — a
    buyer who already speaks IAB podcast measurement can trust the download and play counts
    coming out of the Statistics API without a bilateral reconciliation.
  reads_on: the Statistics API surface (/stats/*)
  caveat: >-
    The claim is made in prose on Blubrry's support pages and on the pricing page, NOT declared
    inside the OpenAPI contract. No certification identifier, audit date or version of the IAB
    guidelines is published, and the statistics responses carry no marker distinguishing
    IAB-certified figures from uncertified ones. Recorded as a documentation claim, which is
    what it is.
- id: nielsen-market-data
  name: Nielsen market data
  body: Nielsen
  conforms: partial
  evidence: https://blubrry.com/services/plans-pricing/
  evidence_type: docs-claim
  detail: >-
    Nielsen market data is listed as an included feature of the Standard and Advanced
    Statistics tiers. It is a third-party data integration, not a conformance profile, and it
    is not exposed as a named field in the published contract.
- id: rss-podcast-feeds
  name: RSS 2.0 with the Apple Podcasts (iTunes) namespace
  conforms: true
  evidence: openapi/blubrry-api-restful-api-for-podcast-publishing-statistics-podcaster-openapi.yaml
  evidence_type: contract
  detail: >-
    The AddEpisode and UpdateEpisode request schemas are field-for-field an RSS/iTunes podcast
    item: itunes_title, itunes_season, itunes_episode_number, itunes_order, itunes_image,
    explicit, plus the Apple category taxonomy in the AppleCategory schema. Blubrry's write
    surface is a typed projection of the podcast feed standard, which is what makes it
    substitutable with any other podcast host's publishing API.
