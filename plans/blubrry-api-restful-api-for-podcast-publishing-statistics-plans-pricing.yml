description: >-
  Blubrry's published plans, read verbatim from https://blubrry.com/services/plans-pricing/ on
  2026-09-06. This replaces a 2026-05-04 scaffold that carried invented API-request quotas.
  IMPORTANT: Blubrry does not price or meter the API. Plans are priced on monthly PUBLISHING
  TIME (hours of audio/video published per month), not on API calls, and no tier on the page
  names an API request quota, an API add-on, or an API-gated feature. API credentials are
  created from Manage Account by any account holder. Annual billing is advertised as "Save 10%"
  but the page does not print the annual rates, so no annual price is recorded.
plan_count: 9
currency: USD
billing_period: month
metered_on: monthly publishing hours (not API requests)
api_metering: none published
free_trial: none published
